[package]
name = "craft-ai-engine-candle"
description = "SAM 3 on the Candle engine for Craft AI: the built-in runner for image.segment, from Meta's checkpoint on this computer. Native only."
version.workspace = true
edition.workspace = true
# Apache-2.0 only, not the workspace's MIT OR Apache-2.0: the model code is a port of Hugging
# Face Transformers (Apache-2.0). See NOTICE.
license = "Apache-2.0"
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
craft-ai-core.workspace = true
craft-ai-engine = { path = "../ai-engine", package = "craft-ai-engine" }
craft-ai-features = { path = "../ai-features", package = "craft-ai-features" }
serde_json.workspace = true
thiserror = "2"
png = "0.17"
# default-features = false keeps Oniguruma (a C library) out; the build stays pure Rust.
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.2", default-features = false, features = ["metal"] }
candle-nn = { version = "=0.9.2", default-features = false, features = ["metal"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
